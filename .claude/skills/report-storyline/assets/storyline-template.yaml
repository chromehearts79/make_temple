# 스토리라인 빈 뼈대. 복사해서 채운다. 다 채운 예: examples/kdn2025-*.yaml
#   (jobs 일자리 및 균등한 기회 · eco 친환경･탄소중립 · startup 창업 및 경제활성화 · coop 상생･협력 및 지역발전)
# 문자열에 ": "나 "[", "," 가 들어가면 작은따옴표로 감싸거나 한 줄에 한 항목씩 쓴다.
# 참조 id: 과제는 "평가내용-과제"(1-2), 장면은 "평가내용-과제-기호"(1-2-나).

보고서: '○○공사 2025년도 경영실적보고서'
연도: 2025

지표:
  범주: 경영관리               # 경영관리 | 주요사업
  평가지표: '안전 및 책임경영'  # 지표 묶음(보고서 목차의 중간 단계)
  지표명: '지표명(편람 그대로)'
  가중치: '3점'
  지표성격: 비계량
  평가방법: '9등급 평가'
  지표정의: '편람 지표정의 그대로'

쪽:                     # 인쇄 쪽 번호
  지표정의: 27
  세부목차: 28
  지적사항: 29
  주요추진실적: 29
  평가내용별: 30

지적사항:               # Ⅰ. 외부 지적사항 조치실적 (전년도 경영평가 지적 등)
  - id: J1
    평가내용: 1
    지적: '지적 문구 그대로'
    조치:
      - '조치 1'
      - '조치 2'
    성과:               # ▣ 정량 성과. 같은 수치를 참고쪽 본문에도 둔다
      - '지표 A ’24년 → B ’25년'
    회수: [1-2-가]      # 배지 「지적사항 개선」을 다는 과제·장면
    참고쪽: 30

외부지적: '국회, 감사원 등 외부 지적사항 : 해당사항 없음'

평가내용:
  - 번호: 1
    문구: '세부평가내용 문구 그대로'
    핵심어:             # 편람 문구를 명사구로 쪼갠다. "노력과 성과"는 빼고, 열거 대상은 하나씩
      K1: '추진 전략 및 계획의 수립'
      K2: '핵심어 2'
    요약:               # Ⅱ. 주요 추진실적 세 칸
      이전: ['전년도까지 쌓은 기반']
      올해: ['올해 새로 더한 일']
      개선: ['지표 A ’24년 → B ’25년']
    # 서두:             # (선택) 과제 1 띠 위의 번호 없는 장 서두. 설계와 같은 칸을 쓰고, 여는 설계로 친다(상생 ②·③)
    #   배경: ['추진배경']
    #   축: [{id: L1, 이름: '추진방향', 과제: [{id: L1-1, 이름: '실행과제'}]}]
    과제:
      - 번호: 1
        쪽: 30
        제목: '[가치·관점]을 반영한 「체계명」 수립'
        역할: 설계       # 설계 | 실행(기본값)
        핵심어: [K1]
        형식: '체계도(배경 → 비전·목표 → 축 → 추진과제 → 성과지표)'
        설계:             # 실행 과제가 머리에 설계를 달 수도 있다(역할은 실행, 배경·축이 있으면 여는 과제로 친다)
          배경: ['환경분석·추진배경']
          비전: '비전'
          목표: '목표'
          세부목표:       # 수치 목표. 본문에서 같은 기준으로 회수한다
            - 항목: '목표 항목'
              목표: '’25년 ○○명'
              회수: 1-2
              실적: '○○명(목표 ○○% 달성)'
          축:             # 뒤 과제·장면이 같은 말로 회수할 칸
            - id: A1
              이름: '추진방향 1'
              과제:
                - {id: A1-1, 이름: '추진과제 1'}
          성과지표:
            - 항목: '성과지표(단위)'
              회수: 1-2
              실적: '같은 단위의 실적'
          # 협업체계: ['…']  # 그 밖의 꼬리 칸(협업체계·실행체계·지원체계 …)은 이름 그대로 쓰면 초안에 찍힌다

      - 번호: 2
        쪽: 30
        제목: '[수단]을 통한 「강조 성과」 달성'
        핵심어: [K2]
        축: [A1-1]
        배지: []         # 지적사항 개선 | Best Practice | 신규 …
        장면:
          - 기호: 가
            태그: ''      # [공정] 같은 장면 태그(선택)
            배지: [지적사항 개선]   # Ⅰ표 J1이 가리키는 곳
            제목: '[수단]으로 [결과] 창출'
            형식: '현황 ▶ 개선 흐름'
            문제: ['(현황) …']
            해결: ['(개선) …']
            결과: ['지표 A ’24년 → B ’25년']
            # 쪽: 31      # (선택) 과제가 두 쪽에 걸칠 때 이 장면이 놓인 쪽
            갈래:         # 칸이 여럿이면(선택)
              - 이름: '① 갈래 이름'
                해결: ['…']
                결과: ['…']

    주요성과:           # 쪽마다 맨 아래 상자
      - 쪽: 30
        과제: [2]
        # 장면: 가       # (선택) 장면 끝에 놓인 상자. 그 장면의 결과로 치고 초안에서 장면 뒤에 찍는다
        내용:
          - '외부 인정·최초·목표 대비·전후 비교 순으로 대표 수치 (예: 지표 A 10명’24년 → 15명’25년)'
